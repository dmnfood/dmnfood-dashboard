<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>들메내식품 · 로그인</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <style>
    .btn-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #22d3ee, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .15s;
      margin-top: 24px;
    }

    .btn-login:hover {
      opacity: .88;
    }

    .btn-login:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-msg {
      display: none;
      background: var(--rv-bg);
      border: 1px solid rgba(248, 113, 113, .25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--rv);
      margin-top: 16px;
    }

    .error-msg.visible {
      display: block;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--t2);
      margin-top: 28px;
      line-height: 1.6;
    }

    .login-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0;
      margin-top: 16px;
      color: var(--t2);
    }

    .login-text-action {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--t2);
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .login-text-action:hover,
    .login-text-action:focus-visible { color: #22d3ee; outline: none; }
    .login-action-divider { color: var(--border); padding: 4px 0; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 7, 18, .74);
      z-index: 100;
    }

    .modal-backdrop.show { display: flex; }
    .modal-card {
      width: min(100%, 420px);
      max-height: calc(100dvh - 40px);
      overflow: auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #101827;
      box-shadow: var(--shadow);
    }

    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-title { color: var(--t0); font-size: 17px; font-weight: 700; }
    .modal-close { border: 0; background: transparent; color: var(--t2); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 5px; }
    .modal-close:hover, .modal-close:focus-visible { color: var(--t0); outline: 1px solid rgba(34,211,238,.45); border-radius: 4px; }
    .modal-note { color: var(--t2); font-size: 12px; line-height: 1.6; margin-bottom: 16px; }
    .modal-status { display: none; margin-top: 12px; font-size: 12px; line-height: 1.5; }
    .modal-status.show { display: block; }
    .modal-status.error { color: var(--rv); }
    .modal-status.success { color: var(--zr); }
    body.modal-open { overflow: hidden; }

    @media (max-width: 420px) {
      .modal-card { padding: 20px 16px; }
      .login-text-action { padding: 4px 7px; }
    }
  </style>
</head>

<body>

  <!-- 배경 블롭 -->
  <div class="blobs">
    <div class="b1"></div>
    <div class="b2"></div>
  </div>

  <!-- 로그인 카드 -->
  <div class="main-center">
    <div class="login-card">

      <!-- 브랜드 -->
      <div class="login-logo-wrap">
        <div class="login-logo">🌿</div>
        <div class="login-title">들메내식품</div>
        <div class="login-sub">내부 대시보드 시스템</div>
      </div>

      <!-- 폼 -->
      <div class="form-group">
        <label class="form-label" for="email">이메일</label>
        <input class="input" type="email" id="email" placeholder="이메일 주소 입력" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="input" type="password" id="password" placeholder="비밀번호" autocomplete="current-password" />
      </div>

      <label style="display:block;margin:14px 0;font-size:13px"><input type="checkbox" id="rememberLogin"> 로그인 유지 (7일 · 개인 기기에서만 사용)</label>
      <p style="font-size:12px;color:var(--t1)">기본 로그인은 최대 8시간 유지되며, 탭을 닫으면 종료됩니다.</p>
      <div class="error-msg" id="errorMsg" role="alert"></div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <div class="spinner" id="spinner"></div>
        <span id="loginBtnText">로그인</span>
      </button>

      <div class="login-actions" aria-label="계정 도움말">
        <button class="login-text-action" id="openSignUpBtn" type="button">회원가입</button>
        <span class="login-action-divider" aria-hidden="true">|</span>
        <button class="login-text-action" id="openRecoveryBtn" type="button">비밀번호 찾기</button>
      </div>

      <div class="footer-note">
        대시보드 전용 이메일 계정으로 로그인하세요.<br>신규 가입은 관리자 승인 후 이용할 수 있습니다.<br>접속 문의: 이승표 대표
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="signUpModal" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="signUpTitle">
      <div class="modal-header"><h2 class="modal-title" id="signUpTitle">회원가입</h2><button class="modal-close" type="button" data-close-modal="signUpModal" aria-label="회원가입 창 닫기">×</button></div>
      <form id="signUpForm">
        <div class="form-group"><label class="form-label" for="signUpName">이름</label><input class="input" id="signUpName" type="text" autocomplete="name" required></div>
        <div class="form-group"><label class="form-label" for="signUpEmail">이메일</label><input class="input" id="signUpEmail" type="email" autocomplete="email" required></div>
        <div class="form-group"><label class="form-label" for="signUpPassword">비밀번호</label><input class="input" id="signUpPassword" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="form-group"><label class="form-label" for="signUpPasswordConfirm">비밀번호 확인</label><input class="input" id="signUpPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required></div>
        <button class="btn-login" id="signUpSubmitBtn" type="submit">가입 신청</button>
        <div class="modal-status" id="signUpStatus" role="status"></div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="recoveryModal" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recoveryTitle">
      <div class="modal-header"><h2 class="modal-title" id="recoveryTitle">비밀번호 찾기</h2><button class="modal-close" type="button" data-close-modal="recoveryModal" aria-label="비밀번호 찾기 창 닫기">×</button></div>
      <p class="modal-note">로그인 아이디는 가입할 때 등록한 이메일 주소입니다.<br>이메일 주소를 모르는 경우 관리자에게 문의해 주세요.</p>
      <form id="recoveryForm">
        <div class="form-group"><label class="form-label" for="recoveryEmail">등록 이메일</label><input class="input" id="recoveryEmail" type="email" autocomplete="email" required></div>
        <button class="btn-login" id="recoverySubmitBtn" type="submit">비밀번호 재설정 메일 보내기</button>
        <div class="modal-status" id="recoveryStatus" role="status"></div>
      </form>
    </section>
  </div>

  <script type="module">
    import { createUserWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signInWithEmailAndPassword, signOut }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { doc, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { auth, db, beginLoginSession, configureLoginPersistence, hasValidLoginSession, isApprovedActiveProfile, loadUserProfile, profileAccessMessage } from '/dashboard/js/firebase-client.js';

    let loginInProgress = false;
    let registrationInProgress = false;
    let navigationCommitted = false;
    let lastFocusedElement = null;
    let activeModalId = '';

    const el = id => document.getElementById(id);

    function navigateOnce(url, reason) {
      if (navigationCommitted) return;
      navigationCommitted = true;
      console.info('[auth] redirect', { page: 'login', target: url, reason });
      window.location.replace(url);
    }

    function loginMessageFor(error) {
      console.error('Firebase login failed:', error);
      return {
        'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
        'auth/user-not-found': '이메일 또는 비밀번호가 올바르지 않습니다.',
        'auth/wrong-password': '이메일 또는 비밀번호가 올바르지 않습니다.',
        'auth/invalid-email': '올바른 이메일 주소를 입력해 주세요.',
        'auth/user-disabled': '사용이 중지된 계정입니다. 관리자에게 문의해 주세요.',
        'auth/too-many-requests': '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.',
        'auth/network-request-failed': '네트워크 연결을 확인한 뒤 다시 시도해 주세요.',
      }[error.code] || '로그인하지 못했습니다. 관리자에게 문의해 주세요.';
    }

    async function accessResult(user, completeRegistration = false) {
      try {
        console.info('[auth] profile path', { page: 'login', path: `users/${user.uid}` });
        let profile = await loadUserProfile(user.uid);
        if (!profile && completeRegistration) {
          const name = window.prompt('가입 설정을 완료하기 위해 이름을 입력해 주세요.');
          if (name?.trim()) {
            profile = { email: user.email, displayName: name.trim().slice(0, 100), employeeName: name.trim().slice(0, 100), role: 'worker', approvalStatus: 'pending', isActive: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
            await setDoc(doc(db, 'users', user.uid), profile);
          }
        }
        if (!profile) return { allowed: false, message: '사용자 프로필이 등록되지 않았습니다. 관리자에게 문의해 주세요.' };
        console.info('[auth] profile status', { page: 'login', uid: user.uid, approvalStatus: profile.approvalStatus || 'legacy', isActive: profile.isActive === true, role: profile.role || '' });
        if (isApprovedActiveProfile(profile)) return { allowed: true };
        return { allowed: false, message: profileAccessMessage(profile) };
      } catch (error) {
        console.error('Failed to load user profile:', { code: error.code || 'unknown', error });
        if (error.code === 'permission-denied' || error.code === 'firestore/permission-denied') {
          return { allowed: false, message: '사용자 프로필 조회 권한이 없습니다. Firestore 규칙과 사용자 UID를 확인해 주세요.' };
        }
        return { allowed: false, message: '사용자 승인 정보를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.' };
      }
    }

    async function denyAccess(message) {
      await signOut(auth).catch(error => console.error('Failed to sign out blocked user:', error));
      showError(message);
    }

    onAuthStateChanged(auth, async user => {
      console.info('[auth] auth state resolved', { page: 'login', projectId: 'dmnfood-haccp', uid: user?.uid || null });
      if (!user || loginInProgress || registrationInProgress) return;
      if (!hasValidLoginSession(user)) { await denyAccess('로그인 유지 정책이 변경되었거나 시간이 만료되었습니다. 다시 로그인해 주세요.'); return; }
      const result = await accessResult(user);
      if (auth.currentUser?.uid !== user.uid) return;
      if (result.allowed) navigateOnce('/home', 'approved-auth-state');
      else await denyAccess(result.message);
    });

    window.handleLogin = async function () {
      if (loginInProgress) return;
      el('errorMsg').classList.remove('visible');
      const email = el('email').value.trim();
      const password = el('password').value;
      if (!email) return showError('이메일을 입력해 주세요.');
      if (!password) return showError('비밀번호를 입력해 주세요.');

      loginInProgress = true;
      el('loginBtn').disabled = true;
      el('spinner').style.display = 'block';
      el('loginBtnText').textContent = '확인 중...';
      try {
        const remember = el('rememberLogin').checked;
        await configureLoginPersistence(remember);
        const credential = await signInWithEmailAndPassword(auth, email, password);
        beginLoginSession(credential.user, remember);
        const result = await accessResult(credential.user, true);
        if (result.allowed) navigateOnce('/home', 'approved-login');
        else await denyAccess(result.message);
      } catch (error) {
        showError(loginMessageFor(error));
      } finally {
        loginInProgress = false;
        el('loginBtn').disabled = false;
        el('spinner').style.display = 'none';
        el('loginBtnText').textContent = '로그인';
      }
    };

    el('password').addEventListener('keydown', event => { if (event.key === 'Enter') window.handleLogin(); });
    el('email').addEventListener('keydown', event => { if (event.key === 'Enter') window.handleLogin(); });

    function showError(message) {
      el('errorMsg').textContent = message;
      el('errorMsg').classList.add('visible');
    }

    function showModalStatus(id, message = '', type = '') {
      const status = el(id);
      status.textContent = message;
      status.className = `modal-status${message ? ` show ${type}` : ''}`;
    }

    function openModal(id, focusId) {
      lastFocusedElement = document.activeElement;
      activeModalId = id;
      el(id).classList.add('show');
      el(id).setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      showModalStatus(id === 'signUpModal' ? 'signUpStatus' : 'recoveryStatus');
      setTimeout(() => el(focusId).focus(), 0);
    }

    function closeModal(id) {
      if (registrationInProgress || id === 'recoveryModal' && el('recoverySubmitBtn').disabled) return;
      el(id).classList.remove('show');
      el(id).setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      activeModalId = '';
      lastFocusedElement?.focus();
    }

    el('openSignUpBtn').addEventListener('click', () => openModal('signUpModal', 'signUpName'));
    el('openRecoveryBtn').addEventListener('click', () => openModal('recoveryModal', 'recoveryEmail'));
    document.querySelectorAll('[data-close-modal]').forEach(button => button.addEventListener('click', () => closeModal(button.dataset.closeModal)));
    document.querySelectorAll('.modal-backdrop').forEach(modal => modal.addEventListener('click', event => { if (event.target === modal) closeModal(modal.id); }));
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && activeModalId) closeModal(activeModalId); });

    el('signUpForm').addEventListener('submit', async event => {
      event.preventDefault();
      if (registrationInProgress) return;
      const name = el('signUpName').value.trim();
      const email = el('signUpEmail').value.trim();
      const password = el('signUpPassword').value;
      if (!name || !email || !password) return showModalStatus('signUpStatus', '모든 필수 항목을 입력해 주세요.', 'error');
      if (password !== el('signUpPasswordConfirm').value) return showModalStatus('signUpStatus', '비밀번호 확인이 일치하지 않습니다.', 'error');

      registrationInProgress = true;
      el('signUpSubmitBtn').disabled = true;
      showModalStatus('signUpStatus');
      try {
        await configureLoginPersistence(false);
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        try {
          await setDoc(doc(db, 'users', credential.user.uid), {
            email,
            displayName: name,
            employeeName: name,
            role: 'worker',
            approvalStatus: 'pending',
            isActive: false,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
        } catch (profileError) {
          console.error('Firebase account was created but profile setup failed:', profileError);
          await signOut(auth);
          showModalStatus('signUpStatus', '계정은 생성되었지만 가입 설정을 완료하지 못했습니다. 입력한 이메일과 비밀번호로 로그인하면 가입 설정을 다시 진행할 수 있습니다.', 'error');
          return;
        }
        await signOut(auth);
        el('signUpForm').reset();
        showModalStatus('signUpStatus', '회원가입이 완료되었습니다. 관리자 승인 후 로그인할 수 있습니다.', 'success');
      } catch (error) {
        console.error('Firebase registration failed:', error);
        const message = {
          'auth/email-already-in-use': '이미 사용 중인 이메일입니다.',
          'auth/invalid-email': '올바른 이메일 주소를 입력해 주세요.',
          'auth/weak-password': '비밀번호는 6자 이상으로 입력해 주세요.',
          'auth/operation-not-allowed': '현재 회원가입을 사용할 수 없습니다. 관리자에게 문의해 주세요.',
          'auth/network-request-failed': '네트워크 연결을 확인한 뒤 다시 시도해 주세요.',
        }[error.code] || '회원가입을 완료하지 못했습니다. 관리자에게 문의해 주세요.';
        showModalStatus('signUpStatus', message, 'error');
      } finally {
        registrationInProgress = false;
        el('signUpSubmitBtn').disabled = false;
      }
    });

    el('recoveryForm').addEventListener('submit', async event => {
      event.preventDefault();
      const email = el('recoveryEmail').value.trim();
      if (!email) return showModalStatus('recoveryStatus', '이메일을 입력해 주세요.', 'error');
      el('recoverySubmitBtn').disabled = true;
      showModalStatus('recoveryStatus');
      auth.languageCode = 'ko';
      try {
        await sendPasswordResetEmail(auth, email);
        showModalStatus('recoveryStatus', '등록된 계정인 경우 비밀번호 재설정 메일을 발송합니다.', 'success');
      } catch (error) {
        if (error.code === 'auth/user-not-found') {
          showModalStatus('recoveryStatus', '등록된 계정인 경우 비밀번호 재설정 메일을 발송합니다.', 'success');
        } else {
          showModalStatus('recoveryStatus', error.code === 'auth/too-many-requests' ? '요청이 많습니다. 잠시 후 다시 시도해 주세요.' : '메일을 요청하지 못했습니다. 이메일 주소와 네트워크 연결을 확인해 주세요.', 'error');
        }
      } finally {
        el('recoverySubmitBtn').disabled = false;
      }
    });
  </script>
</body>

</html>
