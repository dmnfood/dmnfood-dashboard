<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>들메내식품 · 원가 관리</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .auth-hidden { display: none !important; }
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #070b14;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    .loading-screen.hidden { display: none; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app-header {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn, .btn-logout-sm {
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--t2);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .15s, color .15s;
    }
    .back-btn:hover, .btn-logout-sm:hover {
      background: rgba(255, 255, 255, .07);
      color: var(--t0);
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--t0);
      font-size: 14px;
      font-weight: 700;
    }
    .app-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d3ee;
    }
    .user-chip {
      font-size: 11px;
      color: var(--t2);
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }
    .page-main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 28px 64px;
      position: relative;
      z-index: 10;
    }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--t0);
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 12px;
      color: var(--t2);
      line-height: 1.6;
    }
    .cost-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .cost-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 150px;
      color: inherit;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .cost-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(to right, #22d3ee, #6366f1);
    }
    .cost-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 211, 238, .3);
      box-shadow: 0 8px 28px rgba(34, 211, 238, .12);
    }
    .card-kicker {
      font-size: 11px;
      color: var(--t2);
      font-weight: 700;
      letter-spacing: .7px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--t0);
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--t2);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
    }
    .status-pill {
      font-size: 11px;
      color: var(--nm);
      background: var(--nm-bg);
      border: 1px solid rgba(96, 165, 250, .25);
      border-radius: 20px;
      padding: 3px 9px;
      font-weight: 700;
    }
    .arrow {
      color: var(--t2);
      transition: transform .15s, color .15s;
    }
    .cost-card:hover .arrow {
      transform: translateX(3px);
      color: #22d3ee;
    }
    .detail-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .detail-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--t0);
    }
    .detail-body {
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .placeholder-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-w);
      padding: 16px;
      min-height: 88px;
    }
    .placeholder-label {
      font-size: 11px;
      color: var(--t2);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .placeholder-value {
      font-size: 13px;
      color: var(--t1);
      line-height: 1.6;
    }
    .materials-body {
      padding: 18px 20px 22px;
    }
    .material-toolbar {
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 14px;
      margin-bottom: 16px;
      align-items: stretch;
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--card-w);
      min-height: 92px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .upload-zone:hover {
      border-color: rgba(34, 211, 238, .45);
      background: rgba(34, 211, 238, .05);
    }
    .upload-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--t0);
      margin-bottom: 5px;
    }
    .upload-sub {
      font-size: 11px;
      color: var(--t2);
      line-height: 1.5;
    }
    .material-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .summary-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-w);
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .summary-label {
      font-size: 10px;
      color: var(--t2);
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .summary-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 800;
      color: var(--t0);
    }
    .material-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .material-search {
      min-width: 220px;
      height: 34px;
      border: 1px solid var(--in-br);
      border-radius: 8px;
      background: var(--in-bg);
      color: var(--t0);
      padding: 0 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      outline: none;
    }
    .material-search::placeholder {
      color: var(--in-ph);
    }
    .material-note {
      font-size: 11px;
      color: var(--t2);
    }
    .material-status {
      font-size: 11px;
      color: var(--t2);
      min-height: 18px;
    }
    .material-status.ok { color: var(--zr); }
    .material-status.err { color: var(--rv); }
    .material-table-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      background: rgba(255, 255, 255, .025);
      max-height: 520px;
    }
    .material-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      font-size: 12px;
    }
    .material-table th,
    .material-table td {
      border-bottom: 1px solid var(--tb-br);
      padding: 10px 12px;
      text-align: left;
      vertical-align: middle;
      color: var(--t1);
    }
    .material-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(12, 18, 32, .96);
      color: var(--t2);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .material-table tr:hover td {
      background: var(--tb-hv);
    }
    .material-table td.code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--t0);
      white-space: nowrap;
    }
    .price-input {
      width: 112px;
      height: 30px;
      border: 1px solid var(--in-br);
      border-radius: 7px;
      background: var(--in-bg);
      color: var(--t0);
      padding: 0 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: right;
      outline: none;
    }
    .price-input:focus {
      border-color: rgba(34, 211, 238, .45);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .08);
    }
    .empty-state {
      padding: 34px 20px;
      text-align: center;
      color: var(--t2);
      font-size: 12px;
    }
    @media (max-width: 760px) {
      .app-header {
        padding: 0 16px;
      }
      .page-main {
        padding: 22px 16px 48px;
      }
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }
      .cost-grid, .detail-body, .material-toolbar, .material-summary {
        grid-template-columns: 1fr;
      }
      .user-chip {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="blobs"><div class="b1"></div><div class="b2"></div></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div style="font-size:12px;color:var(--t2);">인증 확인 중...</div>
  </div>

  <div id="mainContent" class="auth-hidden">
    <header class="app-header">
      <div class="header-left">
        <a class="back-btn" href="/home">← 홈</a>
        <div class="app-title"><span class="dot"></span><span id="navTitle">원가 관리</span></div>
      </div>
      <div class="header-right">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-logout-sm" onclick="handleLogout()">로그아웃</button>
      </div>
    </header>

    <main class="page-main">
      <section class="hero">
        <div>
          <h1 id="pageTitle">원가 관리</h1>
          <p id="pageDesc">BOM, 원부자재 단가, 원가표, 신제품 원가 계산 흐름을 관리합니다.</p>
        </div>
      </section>

      <section id="cardView" class="cost-grid" aria-label="원가 관리 메뉴"></section>
      <section id="detailView" class="detail-panel auth-hidden" aria-label="원가 관리 상세"></section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAlvRWMpYV5Cq2vb0XxpA4t56KuByj8KuE",
      authDomain: "dmnfood-erp.firebaseapp.com",
      projectId: "dmnfood-erp",
      storageBucket: "dmnfood-erp.firebasestorage.app",
      messagingSenderId: "409700382543",
      appId: "1:409700382543:web:35f38e8890702899f2cb58"
    };

    const pages = [
      {
        path: '/cost-bom',
        kicker: 'BOM',
        title: 'BOM 관리 및 조회',
        desc: 'Ecount BOM 엑셀 구조 기준의 품목-소모품목 연결 조회 영역입니다.',
        boxes: [
          ['기준 구조', '생산품목코드, 생산품목명, 생산수량, 소모품목코드, 소모수량'],
          ['Excel 연결', 'Ecount BOM 다운로드/업로드 양식 매핑 예정'],
          ['상태', '조회 화면 준비 단계']
        ]
      },
      {
        path: '/cost-materials',
        kicker: 'Materials',
        title: '원/부자재 단가 관리',
        desc: '원재료, 부자재, 포장재 단가를 원가 계산의 기준 데이터로 관리합니다.',
        view: 'materials',
        boxes: [
          ['기준 데이터', '품목코드, 품목명, 단위, 입고단가, 출고단가'],
          ['Excel 연결', '품목 자료올리기 양식 및 수기 원가표 단가 매핑 예정'],
          ['상태', '단가 기준표 준비 단계']
        ]
      },
      {
        path: '/cost-sheets',
        kicker: 'Sheets',
        title: '원가표',
        desc: '기존 제조원가계산 흐름을 품목별 원가표 화면으로 정리합니다.',
        boxes: [
          ['기준 구조', '제품별 구성품, 원재료비, 부자재비, 포장비, 합계'],
          ['Excel 연결', '제조원가계산 workbook의 수식/가정 분리 예정'],
          ['상태', '원가표 보기 준비 단계']
        ]
      },
      {
        path: '/new-product-cost-calculator',
        kicker: 'Calculator',
        title: '신제품 원가 계산기',
        desc: '신규 세트 구성과 예상 단가를 조합해 사전 원가를 검토합니다.',
        boxes: [
          ['기준 구조', '세트분류, 세트명, 용량, 개수, 원산지, 구성품'],
          ['Excel 연결', '원가표.xlsx 계산기/세트구성 데이터시트 확장 예정'],
          ['상태', '입력 양식 준비 단계']
        ]
      }
    ];

    const MATERIAL_STORAGE_KEY = 'dmf_cost_materials_v1';
    let materials = loadMaterials();
    let materialSearch = '';

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return 0;
      const cleaned = String(value).replace(/,/g, '').trim();
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatPrice(value) {
      const numeric = toNumber(value);
      return numeric ? numeric.toLocaleString('ko-KR') : '0';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function loadMaterials() {
      try {
        const saved = JSON.parse(localStorage.getItem(MATERIAL_STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveMaterials() {
      localStorage.setItem(MATERIAL_STORAGE_KEY, JSON.stringify(materials));
    }

    function normalizeHeader(value) {
      return String(value || '').replace(/\s+/g, '').trim();
    }

    function buildHeaderMap(headerRow) {
      const map = new Map();
      headerRow.forEach((header, index) => {
        const normalized = normalizeHeader(header);
        if (normalized) map.set(normalized, index);
      });
      return map;
    }

    function getCell(row, headerMap, headerName) {
      const index = headerMap.get(normalizeHeader(headerName));
      return index === undefined ? '' : row[index];
    }

    function mapEcountItemRow(row, headerMap) {
      return {
        itemCode: String(getCell(row, headerMap, '품목코드') || '').trim(),
        itemName: String(getCell(row, headerMap, '품목명') || '').trim(),
        spec: String(getCell(row, headerMap, '규격') || '').trim(),
        unit: String(getCell(row, headerMap, '단위') || '').trim(),
        itemType: String(getCell(row, headerMap, '품목구분') || '').trim(),
        purchasePrice: toNumber(getCell(row, headerMap, '입고단가')),
        salesPrice: toNumber(getCell(row, headerMap, '출고단가')),
        barcode: String(getCell(row, headerMap, '바코드') || '').trim(),
        safeStock: toNumber(getCell(row, headerMap, '안전재고수량')),
      };
    }

    function findMaterialSheet(workbook) {
      const required = ['품목코드', '품목명'];
      const preferred = workbook.SheetNames.find(name => name.includes('품목'));
      const names = preferred
        ? [preferred, ...workbook.SheetNames.filter(name => name !== preferred)]
        : workbook.SheetNames;

      for (const name of names) {
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: '' });
        if (!rows.length) continue;
        const headerRowIndex = rows.findIndex(row => {
          const headerMap = buildHeaderMap(row);
          return required.every(header => headerMap.has(normalizeHeader(header)));
        });
        if (headerRowIndex === -1) continue;
        const headerMap = buildHeaderMap(rows[headerRowIndex]);
        return { name, rows: rows.slice(headerRowIndex + 1), headerMap };
      }

      return null;
    }

    function setMaterialStatus(message, type = '') {
      const status = document.getElementById('materialStatus');
      if (!status) return;
      status.textContent = message;
      status.className = `material-status ${type}`.trim();
    }

    function getFilteredMaterials() {
      const term = materialSearch.trim().toLowerCase();
      if (!term) return materials;
      return materials.filter(item => (
        item.itemCode.toLowerCase().includes(term)
        || item.itemName.toLowerCase().includes(term)
        || item.spec.toLowerCase().includes(term)
      ));
    }

    function renderMaterialTable() {
      const tableBody = document.getElementById('materialTableBody');
      const empty = document.getElementById('materialEmpty');
      const totalEl = document.getElementById('materialTotalCount');
      const pricedEl = document.getElementById('materialPricedCount');
      const editedEl = document.getElementById('materialEditedCount');
      if (!tableBody || !empty) return;

      const filtered = getFilteredMaterials();
      if (totalEl) totalEl.textContent = materials.length.toLocaleString('ko-KR');
      if (pricedEl) pricedEl.textContent = materials.filter(item => toNumber(item.purchasePrice) > 0).length.toLocaleString('ko-KR');
      if (editedEl) editedEl.textContent = materials.filter(item => item.edited).length.toLocaleString('ko-KR');

      empty.style.display = filtered.length ? 'none' : 'block';
      tableBody.innerHTML = filtered.map(item => `
        <tr>
          <td class="code">${escapeHtml(item.itemCode)}</td>
          <td>${escapeHtml(item.itemName)}</td>
          <td>${escapeHtml(item.spec || '-')}</td>
          <td>${escapeHtml(item.unit || '-')}</td>
          <td>${formatPrice(item.purchasePrice)}</td>
          <td>
            <input class="price-input" type="number" min="0" step="1" value="${toNumber(item.purchasePrice)}"
              data-code="${escapeHtml(item.itemCode)}" data-field="purchasePrice" aria-label="${escapeHtml(item.itemName)} 입고단가">
          </td>
          <td>
            <input class="price-input" type="number" min="0" step="1" value="${toNumber(item.salesPrice)}"
              data-code="${escapeHtml(item.itemCode)}" data-field="salesPrice" aria-label="${escapeHtml(item.itemName)} 출고단가">
          </td>
        </tr>
      `).join('');
    }

    function bindMaterialEvents() {
      const fileInput = document.getElementById('materialFileInput');
      const uploadZone = document.getElementById('materialUploadZone');
      const searchInput = document.getElementById('materialSearch');
      const tableBody = document.getElementById('materialTableBody');

      uploadZone?.addEventListener('click', () => fileInput?.click());
      fileInput?.addEventListener('change', async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        await importMaterialWorkbook(file);
        event.target.value = '';
      });

      searchInput?.addEventListener('input', event => {
        materialSearch = event.target.value;
        renderMaterialTable();
      });

      tableBody?.addEventListener('change', event => {
        const input = event.target.closest('.price-input');
        if (!input) return;
        const target = materials.find(item => item.itemCode === input.dataset.code);
        if (!target) return;
        target[input.dataset.field] = toNumber(input.value);
        target.edited = true;
        saveMaterials();
        renderMaterialTable();
        setMaterialStatus('수정사항이 브라우저에 저장되었습니다.', 'ok');
      });
    }

    async function importMaterialWorkbook(file) {
      if (!window.XLSX) {
        setMaterialStatus('엑셀 처리 라이브러리를 불러오지 못했습니다.', 'err');
        return;
      }

      try {
        setMaterialStatus('엑셀 파일을 읽는 중...');
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheet = findMaterialSheet(workbook);
        if (!sheet) {
          setMaterialStatus('품목코드/품목명 열이 있는 품목 시트를 찾지 못했습니다.', 'err');
          return;
        }

        const nextMaterials = sheet.rows
          .map(row => mapEcountItemRow(row, sheet.headerMap))
          .filter(item => item.itemCode && item.itemName);

        if (!nextMaterials.length) {
          setMaterialStatus('가져올 품목 데이터가 없습니다.', 'err');
          return;
        }

        const existingByCode = new Map(materials.map(item => [item.itemCode, item]));
        materials = nextMaterials.map(item => {
          const existing = existingByCode.get(item.itemCode);
          return existing?.edited
            ? { ...item, purchasePrice: existing.purchasePrice, salesPrice: existing.salesPrice, edited: true }
            : item;
        });
        saveMaterials();
        renderMaterialTable();
        setMaterialStatus(`${sheet.name}에서 ${materials.length.toLocaleString('ko-KR')}개 품목을 가져왔습니다.`, 'ok');
      } catch (error) {
        console.error(error);
        setMaterialStatus('엑셀 파일을 처리하지 못했습니다.', 'err');
      }
    }

    function renderMaterialsView(detailView, current) {
      detailView.innerHTML = `
        <div class="detail-head">
          <div>
            <div class="detail-title">${current.title}</div>
            <div class="material-note">Ecount 품목 엑셀을 내부 표준 단가 데이터로 변환합니다.</div>
          </div>
          <span class="status-pill">기초 운영</span>
        </div>
        <div class="materials-body">
          <div class="material-toolbar">
            <label class="upload-zone" id="materialUploadZone">
              <input id="materialFileInput" type="file" accept=".xlsx,.xls" hidden>
              <span class="upload-title">엑셀 업로드</span>
              <span class="upload-sub">품목코드, 품목명 열이 있는 Ecount 품목 자료를 선택하세요.</span>
            </label>
            <div class="material-summary">
              <div class="summary-card">
                <div class="summary-label">Items</div>
                <div class="summary-value" id="materialTotalCount">0</div>
              </div>
              <div class="summary-card">
                <div class="summary-label">Priced</div>
                <div class="summary-value" id="materialPricedCount">0</div>
              </div>
              <div class="summary-card">
                <div class="summary-label">Edited</div>
                <div class="summary-value" id="materialEditedCount">0</div>
              </div>
            </div>
          </div>
          <div class="material-actions">
            <input class="material-search" id="materialSearch" type="search" placeholder="품목코드 / 품목명 / 규격 검색" value="${escapeHtml(materialSearch)}">
            <div class="material-status" id="materialStatus"></div>
          </div>
          <div class="material-table-wrap">
            <table class="material-table">
              <thead>
                <tr>
                  <th>품목코드</th>
                  <th>품목명</th>
                  <th>규격</th>
                  <th>단위</th>
                  <th>현재단가</th>
                  <th>입고단가</th>
                  <th>출고단가</th>
                </tr>
              </thead>
              <tbody id="materialTableBody"></tbody>
            </table>
            <div class="empty-state" id="materialEmpty">아직 가져온 품목 데이터가 없습니다.</div>
          </div>
        </div>
      `;

      bindMaterialEvents();
      renderMaterialTable();
      if (materials.length) setMaterialStatus('저장된 단가 데이터를 불러왔습니다.', 'ok');
    }

    function render() {
      const current = pages.find(page => page.path === window.location.pathname);
      const cardView = document.getElementById('cardView');
      const detailView = document.getElementById('detailView');

      if (!current) {
        document.getElementById('navTitle').textContent = '원가 관리';
        document.getElementById('pageTitle').textContent = '원가 관리';
        document.getElementById('pageDesc').textContent = 'BOM, 원부자재 단가, 원가표, 신제품 원가 계산 흐름을 관리합니다.';
        detailView.classList.add('auth-hidden');
        cardView.classList.remove('auth-hidden');
        cardView.innerHTML = pages.map(page => `
          <a class="cost-card" href="${page.path}">
            <div class="card-kicker">${page.kicker}</div>
            <div class="card-title">${page.title}</div>
            <div class="card-desc">${page.desc}</div>
            <div class="card-meta">
              <span class="status-pill">준비 중</span>
              <span class="arrow">→</span>
            </div>
          </a>
        `).join('');
        return;
      }

      document.getElementById('navTitle').textContent = current.title;
      document.getElementById('pageTitle').textContent = current.title;
      document.getElementById('pageDesc').textContent = current.desc;
      cardView.classList.add('auth-hidden');
      detailView.classList.remove('auth-hidden');
      if (current.view === 'materials') {
        renderMaterialsView(detailView, current);
        return;
      }
      detailView.innerHTML = `
        <div class="detail-head">
          <div class="detail-title">${current.title}</div>
          <span class="status-pill">준비 중</span>
        </div>
        <div class="detail-body">
          ${current.boxes.map(([label, value]) => `
            <div class="placeholder-box">
              <div class="placeholder-label">${label}</div>
              <div class="placeholder-value">${value}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    render();

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = '/';
        return;
      }
      document.getElementById('userChip').textContent = user.email.split('@')[0];
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('auth-hidden');
    });

    window.handleLogout = async () => {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      await signOut(auth);
      window.location.href = '/';
    };
  </script>
</body>

</html>
