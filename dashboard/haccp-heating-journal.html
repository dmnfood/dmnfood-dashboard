<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중요관리점(CCP-1) 모니터링일지 [가열 공정]</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <style>
    body { background: var(--bg); } .shell{max-width:1200px;margin:auto;padding:24px 20px 60px;position:relative;z-index:1}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:16px}.toolbar label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--t2);font-weight:700}.toolbar input{height:38px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--in-bg);color:var(--t0)}.journal-sheet{width:min(100%,210mm);margin:0 auto 24px;background:#fff;color:#111;padding:9mm;box-shadow:0 12px 34px #0006;font-family:'Noto Sans KR',sans-serif}.journal-title{text-align:center;font-size:20px;font-weight:800;margin:3px 0 12px}.journal-title small{display:block;font-size:13px;margin-top:3px}.journal-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:8px}.journal-meta div{border:1px solid #333;padding:6px 8px;font-size:11px}.criteria{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:8px}.criteria div{border:1px solid #333;padding:6px 8px;font-size:11px}.criteria b{display:block;margin-bottom:3px}.method{border:1px solid #333;padding:6px 8px;font-size:10px;line-height:1.5;margin-bottom:8px}.journal-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9px}.journal-table th,.journal-table td{border:1px solid #222;padding:4px 3px;text-align:center;vertical-align:middle;height:25px;word-break:break-word}.journal-table th{background:#dcecf5;font-weight:700}.journal-table .product{text-align:left}.journal-table .signature{min-width:42px}.corrective-title{font-size:11px;font-weight:700;margin:9px 0 3px}.corrective{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9px}.corrective th,.corrective td{border:1px solid #222;padding:5px;vertical-align:top;white-space:pre-line;min-height:42px}.corrective th{background:#dcecf5}.approval{display:grid;grid-template-columns:1fr 70px 70px;margin-top:8px;font-size:10px}.approval div{border:1px solid #222;padding:7px;text-align:center;min-height:35px}.screen-status{color:var(--t1);font-size:12px;margin:0 0 12px}.sheet-page{break-after:page;page-break-after:always}.sheet-page:last-child{break-after:auto;page-break-after:auto}@media(max-width:700px){.shell{padding:14px 8px}.journal-sheet{padding:5mm;overflow-x:auto}.journal-table{min-width:700px}.journal-title{font-size:16px}}@page{size:A4 portrait;margin:8mm}@media print{body{background:#fff}.screen-only,.blobs{display:none!important}.shell{padding:0;max-width:none}.journal-sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}.sheet-page{break-after:page;page-break-after:always}.journal-table th,.journal-table td,.corrective th,.corrective td{border-color:#000}.journal-title{margin-top:0}}
  </style>
</head>
<body>
<div class="blobs"><div class="b1"></div><div class="b2"></div></div>
<main class="shell">
  <div class="toolbar screen-only">
    <a class="back-btn" href="/haccp-heating">기록 입력</a><a class="back-btn" href="/home?category=haccp">홈</a>
    <label>조회일자<input id="journalDate" type="date"></label><button class="btn-secondary" id="loadBtn" type="button">조회</button><button class="btn-secondary" id="todayBtn" type="button">오늘</button><button class="btn-primary" id="printBtn" type="button">인쇄 / PDF 저장</button>
  </div>
  <div class="screen-status" id="journalStatus">인증 확인 중...</div>
  <div id="journalOutput"></div>
</main>
<script type="module">
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { auth, isApprovedActiveProfile, loadUserProfile } from '/dashboard/js/firebase-client.js';
import { escapeHtml, formatDateValue } from '/dashboard/js/haccp-form-common.js';
import { DEFAULT_HEATING_SETTINGS, loadHeatingSettings, subscribeHeatingRecordsByDate } from '/dashboard/js/haccp-heating-firestore.js';
const $=id=>document.getElementById(id); let records=[],settings={...DEFAULT_HEATING_SETTINGS},unsubscribe=null,navigated=false;
const navigateOnce=(url,reason)=>{if(navigated)return;navigated=true;console.info('[auth] redirect',{page:'haccp-heating-journal',target:url,reason});location.replace(url)};
const time=r=>r.measurements?.measuredTime||''; const sortRecords=list=>[...list].sort((a,b)=>Number(a.measurements?.roasterNo)-Number(b.measurements?.roasterNo)||time(a).localeCompare(time(b)));
function render(){const date=$('journalDate').value;const sorted=sortRecords(records);const groups=Object.fromEntries(['1','2','3','4'].map(n=>[n,sorted.filter(r=>String(r.measurements?.roasterNo)===n)]));const pages=Math.max(1,...Object.values(groups).map(g=>Math.ceil(g.length/4)));const inspectors=[...new Set(sorted.map(r=>r.workerName).filter(Boolean))].join(', ');$('journalStatus').textContent=sorted.length?`${date} · ${sorted.length}건 · PASS ${sorted.filter(r=>r.judgement==='PASS').length}건 · FAIL ${sorted.filter(r=>r.judgement==='FAIL').length}건`:`${date}에 저장된 기록이 없습니다. 빈 양식으로 인쇄할 수 있습니다.`;$('journalOutput').innerHTML=Array.from({length:pages},(_,i)=>sheet(groups,i,date,inspectors)).join('');}
function cell(r,key){return r?escapeHtml(key(r)||''):'&nbsp;'} function sheet(groups,index,date,inspectors){const rows=['1','2','3','4'].map(no=>{const items=groups[no].slice(index*4,index*4+4);return Array.from({length:4},(_,i)=>{const r=items[i];return `<tr>${i===0?`<td rowspan="4">${no}</td>`:''}<td class="product">${cell(r,x=>x.productName)}</td><td>${cell(r,x=>x.measurements?.setTemperature)}</td><td>${cell(r,time)}</td><td>${cell(r,x=>x.measurements?`${x.measurements.heatingMinutes||''}분 ${x.measurements.heatingSeconds||''}초`:'')}</td><td>${cell(r,x=>x.measurements?.productTemperature)}</td><td>${cell(r,x=>x.judgement)}</td><td class="signature"></td></tr>`}).join('')}).join('');const fails=sortRecords(Object.values(groups).flat()).filter(r=>r.judgement==='FAIL');const aggregate=(key)=>fails.map((r,i)=>`${i+1}. [${r.measurements?.roasterNo||'-'}호 / ${time(r)||'-'}] ${r[key]||''}`).join('\n');return `<section class="journal-sheet sheet-page"><h1 class="journal-title">중요관리점(CCP-1) 모니터링일지<small>[가열 공정]</small></h1><div class="approval"><div>결재</div><div>작성</div><div>확인</div></div><div class="journal-meta"><div>작성일자: ${escapeHtml(date)}</div><div>점검자: ${escapeHtml(inspectors)}</div><div>페이지 ${index+1}</div></div><div class="criteria"><div><b>제품 표면온도</b>${settings.productSurfaceTempMin}~${settings.productSurfaceTempMax}℃</div><div><b>가열시간</b>${settings.heatingMinutesTarget} ± ${settings.heatingMinutesTolerance}분</div></div><div class="method"><b>점검 주기</b> 작업 시작 전, 2시간마다<br><b>점검 방법</b> 온도계로 제품 표면온도를 확인하고 타이머로 가열시간을 확인합니다. 온도계는 연 1회 검·교정이 필요합니다.</div><table class="journal-table"><thead><tr><th>볶음기 No.</th><th>품명</th><th>세팅온도</th><th>측정시각</th><th>가열시간</th><th>적외선온도<br>(제품품온)</th><th>판정</th><th>서명</th></tr></thead><tbody>${rows}</tbody></table><div class="method"><b>개선조치 방법</b><br>가열온도 및 가열시간 초과 시 제품 검사 후 이상이 없을 때 출고합니다. 기계 고장 시 생산을 중단하고 수리 후 생산을 재개합니다.</div><div class="corrective-title">한계기준 이탈 및 개선조치 기록</div><table class="corrective"><thead><tr><th>한계기준 이탈내용</th><th>개선조치 및 결과</th><th>조치자</th><th>확인</th></tr></thead><tbody><tr><td>${escapeHtml(aggregate('deviationDetail'))}</td><td>${escapeHtml(aggregate('correctiveAction'))}</td><td>${escapeHtml(aggregate('actionBy'))}</td><td>${escapeHtml(aggregate('verifiedBy'))}</td></tr></tbody></table></section>`}
async function loadDate(){const date=$('journalDate').value;if(!date)return;$('journalStatus').textContent='기록을 불러오는 중...';unsubscribe?.();unsubscribe=subscribeHeatingRecordsByDate(date,list=>{records=list;render()},error=>{console.error('Journal query failed',error);$('journalStatus').textContent=error.code==='permission-denied'?'기록 조회 권한이 없습니다.':'네트워크 연결을 확인해 주세요.'})}
$('loadBtn').addEventListener('click',loadDate);$('todayBtn').addEventListener('click',()=>{$('journalDate').value=formatDateValue(new Date());loadDate()});$('printBtn').addEventListener('click',()=>{const original=document.title;document.title=`CCP-1_가열공정_모니터링일지_${$('journalDate').value}`;window.addEventListener('afterprint',()=>{document.title=original},{once:true});window.print()});
onAuthStateChanged(auth,async user=>{if(!user){navigateOnce('/','signed-out');return}try{const profile=await loadUserProfile(user.uid);if(!isApprovedActiveProfile(profile)){await signOut(auth);navigateOnce('/','profile-blocked');return}settings=await loadHeatingSettings();$('journalDate').value=formatDateValue(new Date());loadDate()}catch(error){console.error('Journal auth/settings failed',error);navigateOnce('/','profile-or-settings-failed')}});
</script>
</body></html>
