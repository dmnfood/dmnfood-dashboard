<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>들메내식품 · 참깨 입찰 분석</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: var(--bg);
      color: var(--t0);
    }

    .page-main {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 24px 60px;
      position: relative;
      z-index: 10;
    }

    .app-header {
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn, .btn-logout-sm {
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--t2);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .15s, color .15s;
    }

    .back-btn:hover, .btn-logout-sm:hover {
      background: rgba(255,255,255,.07);
      color: var(--t0);
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--t0);
      font-size: 14px;
      font-weight: 700;
    }

    .app-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d3ee;
    }

    .user-chip {
      font-size: 11px;
      color: var(--t2);
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    .hero-card,
    .section-card,
    .chart-card,
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-card {
      padding: 22px 24px;
      margin-bottom: 16px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--t2);
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .hero-text {
      font-size: 13px;
      color: var(--t2);
      line-height: 1.7;
      max-width: 860px;
    }

    .upload-box {
      border: 1px dashed rgba(255,255,255,.20);
      border-radius: 14px;
      padding: 18px;
      background: rgba(255,255,255,.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .upload-box:hover,
    .upload-box.dragover {
      border-color: rgba(34,211,238,.45);
      background: rgba(34,211,238,.08);
    }

    .upload-box input {
      display: none;
    }

    .upload-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .btn,
    .btn-secondary {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--t0);
      background: rgba(255,255,255,.06);
      transition: background .15s ease, border-color .15s ease;
    }

    .btn:hover,
    .btn-secondary:hover {
      background: rgba(255,255,255,.10);
      border-color: rgba(34,211,238,.24);
    }

    .btn-secondary {
      background: transparent;
      color: var(--t2);
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: var(--t2);
    }

    .status-text.error {
      color: #f87171;
    }

    .section-card {
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .filter-card [hidden] { display: none !important; }
    .import-tools { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .import-tools .filter-row { margin-top: 12px; }
    #pilotFetch, .upload-inline-field .upload-box {
      height: 38px;
      box-sizing: border-box;
    }
    #pilotFetch {
      background: #4ade80;
      border-color: #4ade80;
      color: #052e16;
    }
    #pilotFetch:hover:not(:disabled) {
      background: #86efac;
      border-color: #86efac;
    }
    .status-text:empty { display: none; }
    .btn:disabled, .btn-secondary:disabled { opacity: .5; cursor: wait; }

    .filter-card {
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .upload-inline-field {
      min-width: 168px;
      flex: 0 0 168px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .upload-inline-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--t2);
    }

    .upload-inline-field .upload-box {
      border: 1px dashed rgba(74,222,128,.28);
      border-radius: 8px;
      padding: 7px 10px;
      background: rgba(255,255,255,.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      min-height: 38px;
      transition: border-color .18s ease, background .18s ease;
    }

    .upload-inline-field .upload-box:hover,
    .upload-inline-field .upload-box.dragover {
      border-color: rgba(74,222,128,.42);
      background: rgba(74,222,128,.08);
    }

    .upload-inline-field input[type="file"] {
      display: none;
    }

    .upload-inline-field .upload-title {
      margin-bottom: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--t0);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }

    .field {
      min-width: 132px;
      flex: 1 1 140px;
    }

    .field.full {
      flex: 2 1 220px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--t2);
      margin-bottom: 6px;
    }

    .field select,
    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(7, 12, 23, .85);
      color: var(--t0);
      padding: 8px 10px;
      font-size: 13px;
    }

    .field select {
      appearance: auto;
      color-scheme: dark;
    }

    .field select option {
      background: #0f172a;
      color: var(--t0);
    }

    .field select:focus,
    .field input:focus {
      outline: 1px solid rgba(34,211,238,.3);
      border-color: rgba(34,211,238,.24);
    }

    .chart-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .chart-card,
    .table-card {
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .chart-count { font-size: 12px; color: var(--t2); text-align: right; white-space: nowrap; }

    .card-title {
      font-size: 14px;
      font-weight: 700;
    }

    .card-caption {
      font-size: 12px;
      color: var(--t2);
    }

    .chart-wrap {
      position: relative;
      height: 320px;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--t2);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 12px;
      height: 3px;
      border-radius: 999px;
      display: inline-block;
    }


    .table-wrapper {
      overflow-x: auto;
    }

    .empty-state {
      text-align: center;
      color: var(--t2);
      padding: 24px 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 860px;
    }

    th,
    td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    th {
      color: var(--t2);
      font-weight: 700;
      background: rgba(255,255,255,.03);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:hover {
      background: rgba(255,255,255,.03);
    }

    .text-right {
      text-align: right;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {

      .chart-row {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 640px) {
      .page-main {
        padding: 16px 14px 40px;
      }


      .filter-row {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
  </div>

  <div class="blobs">
    <div class="b1"></div>
    <div class="b2"></div>
  </div>

  <div class="auth-hidden" id="mainContent">
    <header class="app-header">
      <div class="header-left">
        <a href="/home" class="back-btn">← 홈</a>
        <div class="app-title"><span class="dot"></span>참깨 입찰 분석</div>
      </div>
      <div class="header-right">
        <div class="user-chip" id="userChip">—</div>
        <button class="btn-logout-sm" type="button" id="logoutBtn">로그아웃</button>
      </div>
    </header>

    <main class="page-main">
      <section id="analysisSection">
        <section class="section-card filter-card">
          <div class="import-tools" aria-label="aT 자동 가져오기">
            <div class="card-title">aT 자동 가져오기</div>
            <div class="filter-row">
              <div class="field"><label for="pilotStart">마감기간 시작</label><input type="date" id="pilotStart" required></div>
              <div class="field"><label for="pilotEnd">마감기간 종료</label><input type="date" id="pilotEnd" required></div>
              <button class="btn" type="button" id="pilotFetch">자동 가져오기</button>
              <div class="upload-inline-field">
                <button class="upload-box" id="dropZone" type="button" aria-label="수동 HAR 파일 업로드 또는 드롭" title="HAR 파일을 선택하거나 끌어다 놓으세요">
                  <span class="upload-title">수동 파일 업로드</span>
                </button>
                <input type="file" id="harFile" accept=".har,application/json" />
              </div>
            </div>
            <div class="status-text" id="statusText" role="status" aria-live="polite"></div>
          </div>
          <div class="filter-row">
            <div class="field">
              <label for="fDate">입찰일</label>
              <select id="fDate"></select>
            </div>
            <div class="field">
              <label for="fOrigin">원산지</label>
              <select id="fOrigin"></select>
            </div>
            <div class="field">
              <label for="fGrade">등급</label>
              <select id="fGrade"></select>
            </div>
            <div class="field">
              <label for="fPack">포장</label>
              <select id="fPack"></select>
            </div>
            <div class="field">
              <label for="fRegion">판매지역</label>
              <select id="fRegion"></select>
            </div>
            <div class="field full">
              <label for="q">검색</label>
              <input id="q" type="text" placeholder="입찰명 또는 항목 검색" />
            </div>
          </div>
        </section>

        <div class="chart-row">
          <section class="chart-card">
            <div class="card-title-row">
              <div>
                <div class="card-title">입찰일별 단가 추이</div>
                <div class="card-caption">점선은 현재 필터의 입찰일별 단가를 평균한 값입니다.</div>
              </div>
              <div class="chart-count" id="chartCount" aria-live="polite">분석 0건 / 전체 0건</div>
            </div>
            <div class="legend">
              <span class="legend-item"><span class="legend-dot" style="background:#f87171"></span>최고 단가</span>
              <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span>평균 단가</span>
              <span class="legend-item"><span class="legend-dot" style="background:#4ade80"></span>최저 단가</span>
            </div>
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
          </section>
        </div>

        <section class="table-card">
          <div class="card-title-row">
            <div>
              <div class="card-title">상세 데이터</div>
              <div class="card-caption" id="tableInfo">0건 표시</div>
            </div>
            <button class="btn-secondary" type="button" id="downloadBtn">CSV 다운로드</button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>입찰일</th>
                  <th>입찰건명</th>
                  <th>품목</th>
                  <th>원산지</th>
                  <th>등급</th>
                  <th>포장</th>
                  <th>판매지역</th>
                  <th class="text-right">물량</th>
                  <th class="text-right">최저</th>
                  <th class="text-right">평균</th>
                  <th class="text-right">최고</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module">
    import { collectBidPages } from '/dashboard/js/atbid-pilot.js';
    import { logoutToLogin, requireApprovedActiveUser } from '/dashboard/js/firebase-client.js';
    const state = { rawRows: [], filteredRows: [], chart: null };

    const $ = (id) => document.getElementById(id);
    const fmt = (value) => Number.isFinite(value) ? Math.round(value).toLocaleString('ko-KR') : '-';
    const money = (value) => Number.isFinite(value) ? `${fmt(value)}원` : '-';
    const avg = (values) => values.length ? values.reduce((s, x) => s + x, 0) / values.length : NaN;
    function setStatus(message, isError = false) {
      const el = $('statusText');
      el.textContent = message;
      el.classList.toggle('error', isError);
    }

    function num(value) {
      const n = Number(String(value ?? '').replace(/,/g, '').trim());
      return Number.isFinite(n) ? n : NaN;
    }

    function heroDate(value) {
      if (!value) return '';
      const text = String(value).trim();
      const match = text.match(/(\d{2})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
      if (match) return `20${match[1]}-${String(match[2]).padStart(2, '0')}-${String(match[3]).padStart(2, '0')}`;
      const slash = text.match(/(\d{4})[\-./](\d{1,2})[\-./](\d{1,2})/);
      if (slash) return `${slash[1]}-${String(slash[2]).padStart(2, '0')}-${String(slash[3]).padStart(2, '0')}`;
      return text;
    }

    function parseTitle(title) {
      title = title || '';
      // 지사/판매형태와 구분 괄호는 제외하고 참깨 바로 뒤의 상품 규격만 읽는다.
      const spec = title.match(/참깨\s*\(([^()]*)\)/)?.[1] || '';
      const parts = spec.split(':').map((s) => s.trim()).filter(Boolean);
      const countries = ['인도', '중국', '파키스탄', '부르키나파소', '모잠비크', '나이지리아', '탄자니아'];
      const originPart = parts.find((x) => /산$/.test(x) || countries.includes(x)) || '';
      const origin = countries.includes(originPart) ? `${originPart}산` : originPart;
      const grade = parts.find((x) => /^\d+\s*등$/.test(x))?.replace(/\s/g, '') || '';
      let pack = parts.find((x) => /파렛|점보|벌크|톤백|포대/.test(x)) || '';
      if (!pack) {
        if (spec.includes('파렛타이징')) pack = '파렛타이징';
        else if (spec.includes('점보백')) pack = '점보백';
        else pack = '일반';
      }
      const matchDate = title.match(/\((\d{2})\.\s*(\d{1,2})\.\s*(\d{1,2})\./);
      const date = matchDate ? `20${matchDate[1]}-${String(matchDate[2]).padStart(2, '0')}-${String(matchDate[3]).padStart(2, '0')}` : '';
      const regionMatch = title.match(/\)\s*([가-힣A-Za-z0-9]+)\s*$/);
      const region = regionMatch ? regionMatch[1] : '';
      return { origin, grade, pack, region, date };
    }

    function parseXmlText(xml) {
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      if (doc.querySelector('parsererror')) return [];

      const rows = [...doc.getElementsByTagName('Row')];
      if (rows.length) {
        return rows.map((row) => {
          const data = {};
          [...row.getElementsByTagName('Col')].forEach((col) => {
            const key = col.getAttribute('id') || col.getAttribute('name') || '';
            data[key] = col.textContent || '';
          });
          return data;
        });
      }

      const recordRows = [...doc.querySelectorAll('record,Record,ROW')];
      if (recordRows.length) {
        return recordRows.map((row) => {
          const data = {};
          [...row.children].forEach((child) => {
            const key = child.getAttribute('id') || child.getAttribute('name') || child.tagName;
            data[key] = child.textContent || '';
          });
          return data;
        });
      }

      return [];
    }

    function decodeContent(content) {
      let text = content?.text || '';
      if (content?.encoding === 'base64') {
        try {
          text = atob(text);
        } catch (error) {
          console.warn('base64 decode failed', error);
        }
      }
      return text;
    }

    function normalizeRows(rows) {
      const seen = new Set();
      return rows
        .map((row) => {
          const title = row['입찰건명'] || row['BID_NM'] || row['TITLE'] || row['title'] || '';
          const parsed = parseTitle(title);
          const date = parsed.date || heroDate(row['입찰일'] || row['BID_DT'] || row['bidDt'] || row['createdDate'] || row['date'] || '') || '';
          const item = row['품명'] || row['ITEM_NM'] || row['itemName'] || row['item'] || '';
          const qty = num(row['총낙찰량'] || row['AWARD_QTY'] || row['awardQty'] || row['qty']);
          const minPrice = num(row['낙찰최저가'] || row['LOWEST_PRICE'] || row['lowPrice'] || row['minPrice']);
          const avgPrice = num(row['낙찰평균가'] || row['AVG_PRICE'] || row['avgPrice'] || row['averagePrice']);
          const maxPrice = num(row['낙찰최고가'] || row['HIGHEST_PRICE'] || row['highPrice'] || row['maxPrice']);
          const branch = row['지사명'] || row['BRANCH_NM'] || row['branch'] || '';
          const bidNo = row['입찰번호'] || row['BID_NO'] || row['bidNo'] || row['bidNumber'] || '';
          const key = [bidNo, title, date, item, avgPrice, minPrice, maxPrice].join('|');
          return {
            key,
            title,
            item,
            qty: Number.isFinite(qty) ? qty : NaN,
            minPrice: Number.isFinite(minPrice) ? minPrice : NaN,
            avgPrice: Number.isFinite(avgPrice) ? avgPrice : NaN,
            maxPrice: Number.isFinite(maxPrice) ? maxPrice : NaN,
            branch,
            bidNo,
            date,
            origin: parsed.origin || row['원산지'] || row['origin'] || '미분류',
            grade: parsed.grade || row['등급'] || row['grade'] || '미분류',
            pack: parsed.pack || row['포장'] || row['pack'] || '일반',
            region: parsed.region || row['판매지역'] || row['region'] || row['지역'] || '미분류'
          };
        })
        .filter((row) => row.title && Number.isFinite(row.avgPrice) && !seen.has(row.key) && seen.add(row.key))
        .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.title || '').localeCompare(b.title || ''));
    }

    function parseInput(text) {
      text = (text || '').trim();
      if (!text) return [];

      let rows = [];
      if (text.startsWith('{')) {
        const har = JSON.parse(text);
        const entries = har.log?.entries || [];
        entries.forEach((entry) => {
          const url = entry.request?.url || '';
          const body = decodeContent(entry.response?.content || {});
          if (url.includes('list.do') || body.includes('<Dataset') || body.includes('<Root') || body.includes('<record')) {
            rows.push(...parseXmlText(body));
          }
        });
      } else if (text.includes('<Dataset') || text.includes('<Root') || text.includes('<record') || text.includes('<Row')) {
        rows = parseXmlText(text);
      } else {
        throw new Error('HAR JSON 또는 Nexacro XML 형식이 아닙니다.');
      }

      return normalizeRows(rows);
    }

    function populateSelect(id, values) {
      const el = $(id);
      const current = el.value;
      const unique = [...new Set(values.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'ko'));
      el.innerHTML = '<option value="">전체</option>' + unique.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
      if ([...el.options].some((option) => option.value === current)) {
        el.value = current;
      }
    }

    function initFilters() {
      populateSelect('fDate', state.rawRows.map((row) => row.date));
      populateSelect('fOrigin', state.rawRows.map((row) => row.origin));
      populateSelect('fGrade', state.rawRows.map((row) => row.grade));
      populateSelect('fPack', state.rawRows.map((row) => row.pack));
      populateSelect('fRegion', state.rawRows.map((row) => row.region));
    }

    function groupByDate(rows) {
      const map = new Map();
      rows.forEach((row) => {
        if (!row.date) return;
        if (!map.has(row.date)) {
          map.set(row.date, { date: row.date, min: [], avg: [], max: [] });
        }
        const bucket = map.get(row.date);
        bucket.min.push(row.minPrice);
        bucket.avg.push(row.avgPrice);
        bucket.max.push(row.maxPrice);
      });
      return [...map.values()]
        .map((bucket) => ({
          date: bucket.date,
          min: avg(bucket.min.filter(Number.isFinite)),
          avg: avg(bucket.avg.filter(Number.isFinite)),
          max: avg(bucket.max.filter(Number.isFinite))
        }))
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    function renderTable() {
      const tbody = $('tableBody');
      const hasRows = state.filteredRows.length > 0;
      $('tableInfo').textContent = hasRows ? `${fmt(state.filteredRows.length)}건 표시` : '0건 표시';
      if (!hasRows) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty-state">HAR 파일을 업로드하면 입찰 결과가 여기 표시됩니다.</td></tr>';
        return;
      }
      tbody.innerHTML = state.filteredRows.map((row) => `
        <tr>
          <td>${escapeHtml(row.date || '')}</td>
          <td>${escapeHtml(row.title || '')}</td>
          <td>${escapeHtml(row.item || '')}</td>
          <td>${escapeHtml(row.origin || '')}</td>
          <td>${escapeHtml(row.grade || '')}</td>
          <td>${escapeHtml(row.pack || '')}</td>
          <td>${escapeHtml(row.region || '')}</td>
          <td class="text-right">${fmt(row.qty)}</td>
          <td class="text-right">${money(row.minPrice)}</td>
          <td class="text-right">${money(row.avgPrice)}</td>
          <td class="text-right">${money(row.maxPrice)}</td>
        </tr>
      `).join('');
    }

    function renderChart() {
      const canvas = $('trendChart');
      const ctx = canvas.getContext('2d');
      const data = groupByDate(state.filteredRows);

      if (state.chart) {
        state.chart.destroy();
      }

      const hasData = data.length > 0;
      const labels = hasData ? data.map((item) => item.date) : Array(8).fill('');
      const averageLines = [
        { key: 'max', label: '최고 단가 · 기간 평균', color: 'rgba(248,113,113,0.45)' },
        { key: 'avg', label: '평균 단가 · 기간 평균', color: 'rgba(96,165,250,0.45)' },
        { key: 'min', label: '최저 단가 · 기간 평균', color: 'rgba(74,222,128,0.45)' }
      ].map(({ key, label, color }) => {
        const mean = avg(data.map(item => item[key]).filter(Number.isFinite));
        return { label, data: data.map(() => Number.isFinite(mean) ? mean : null),
          borderColor: color, borderDash: [6, 5], borderWidth: 2,
          pointRadius: 0, pointHoverRadius: 0, tension: 0, fill: false, order: 1 };
      });
      state.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: '최고 단가',
              data: data.map((item) => item.max),
              borderColor: '#f87171',
              backgroundColor: 'rgba(248,113,113,0.15)',
              pointRadius: 3,
              tension: 0.2
            },
            {
              label: '평균 단가',
              data: data.map((item) => item.avg),
              borderColor: '#60a5fa',
              backgroundColor: 'rgba(96,165,250,0.12)',
              pointRadius: 3,
              tension: 0.2
            },
            {
              label: '최저 단가',
              data: data.map((item) => item.min),
              borderColor: '#4ade80',
              backgroundColor: 'rgba(74,222,128,0.12)',
              pointRadius: 3,
              tension: 0.2
            },
            ...averageLines
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: hasData,
              filter: (context) => context.datasetIndex < 3,
              callbacks: {
                label: (context) => `${context.dataset.label}: ${money(context.parsed.y)}`
              }
            }
          },
          scales: {
            x: { ticks: { display: hasData, color: 'rgba(255,255,255,0.7)' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { display: hasData, color: 'rgba(255,255,255,0.7)', callback: (value) => `${fmt(value)}` }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function render() {
      $('chartCount').textContent = `분석 ${fmt(state.filteredRows.length)}건 / 전체 ${fmt(state.rawRows.length)}건`;
      renderTable();
      renderChart();
    }

    function applyFilters() {
      const query = $('q').value.trim().toLowerCase();
      const selectedDate = $('fDate').value;
      const selectedOrigin = $('fOrigin').value;
      const selectedGrade = $('fGrade').value;
      const selectedPack = $('fPack').value;
      const selectedRegion = $('fRegion').value;

      state.filteredRows = state.rawRows.filter((row) => {
        const matchesDate = !selectedDate || row.date === selectedDate;
        const matchesOrigin = !selectedOrigin || row.origin === selectedOrigin;
        const matchesGrade = !selectedGrade || row.grade === selectedGrade;
        const matchesPack = !selectedPack || row.pack === selectedPack;
        const matchesRegion = !selectedRegion || row.region === selectedRegion;
        const matchesQuery = !query || [row.title, row.item, row.origin, row.grade, row.pack, row.region].join(' ').toLowerCase().includes(query);
        return matchesDate && matchesOrigin && matchesGrade && matchesPack && matchesRegion && matchesQuery;
      });

      render();
    }

    let pilotController = null;
    let loadVersion = 0;
    const dateInKorea = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());
    $('pilotEnd').value = dateInKorea;
    $('pilotStart').value = new Date(Date.parse(dateInKorea) - 90 * 86400000).toISOString().slice(0, 10);
    function pilotStatus(message, error = false) {
      setStatus(message, error);
    }
    $('pilotFetch').addEventListener('click', async () => {
      const start = $('pilotStart').value, end = $('pilotEnd').value;
      if (!start || !end || start > end || (Date.parse(end) - Date.parse(start)) / 86400000 > 366) {
        pilotStatus('시작일과 종료일을 확인해 주세요. 한 번에 최대 1년까지 조회할 수 있습니다.', true);
        return;
      }
      const version = ++loadVersion;
      const controller = new AbortController();
      pilotController = controller;
      $('pilotFetch').disabled = true;
      $('pilotStart').disabled = $('pilotEnd').disabled = true;
      pilotStatus('aT에서 첫 페이지를 조회하고 있습니다…');
      const timeout = setTimeout(() => controller.abort(), 180000);
      try {
        const result = await collectBidPages({ start, end, signal: controller.signal,
          onProgress: (loaded, total) => pilotStatus(loaded.toLocaleString() + ' / ' + total.toLocaleString() + '건 수집 중…') });
        controller.signal.throwIfAborted();
        if (version !== loadVersion) return;
        if (!result.total) { pilotStatus('해당 기간의 참깨 결과가 없습니다. 기존 분석을 유지합니다.'); return; }
        const rows = normalizeRows(result.rows);
        if (!rows.length) throw new Error('분석 가능한 결과가 없습니다. 기존 분석을 유지합니다.');
        state.rawRows = rows;
        state.filteredRows = rows;
        ['fDate', 'fOrigin', 'fGrade', 'fPack', 'fRegion', 'q'].forEach(id => { $(id).value = ''; });
        initFilters();
        applyFilters();
        setStatus('');
      } catch (error) {
        if (version !== loadVersion) return;
        pilotStatus(controller.signal.aborted ? '수집이 중지되었거나 제한 시간이 지났습니다. 기존 분석을 유지합니다.' : error.message + ' 기존 분석을 유지합니다.', !controller.signal.aborted);
      } finally {
        clearTimeout(timeout);
        pilotController = null;
        $('pilotFetch').disabled = false;
        $('pilotStart').disabled = $('pilotEnd').disabled = false;
      }
    });

    async function handleFile(file) {
      if (!file) return;
      const version = ++loadVersion;
      if (pilotController) {
        pilotController.abort();
        pilotStatus('자동 수집을 중지하고 HAR 파일을 불러옵니다.');
      }
      setStatus('HAR 파일을 불러오고 있습니다…');
      try {
        const content = await file.text();
        if (version !== loadVersion) return;
        const rows = parseInput(content);
        state.rawRows = rows;
        state.filteredRows = rows;
        $('analysisSection').classList.remove('hidden');
        initFilters();
        applyFilters();
        setStatus('');
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    document.getElementById('harFile').addEventListener('change', (event) => handleFile(event.target.files[0]));

    const dropZone = $('dropZone');
    dropZone.addEventListener('click', () => $('harFile').click());
    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });
    dropZone.addEventListener('drop', (event) => handleFile(event.dataTransfer.files[0]));

    ['fDate', 'fOrigin', 'fGrade', 'fPack', 'fRegion', 'q'].forEach((id) => {
      $(id).addEventListener('input', applyFilters);
      $(id).addEventListener('change', applyFilters);
    });


    $('downloadBtn').addEventListener('click', () => {
      const rows = state.filteredRows.map((row, index) => [index + 1, row.date, row.title, row.item, row.origin, row.grade, row.pack, row.region, row.qty, row.minPrice, row.avgPrice, row.maxPrice]);
      const csv = '\uFEFF' + [['순번', '입찰일', '입찰건명', '품목', '원산지', '등급', '포장', '판매지역', '물량', '최저', '평균', '최고'], ...rows]
        .map((row) => row.map((value) => `"${String(value ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const link = document.createElement('a');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      link.href = URL.createObjectURL(blob);
      link.download = 'sesame_bid_analysis.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    initFilters();
    render();

    requireApprovedActiveUser({ page: 'sesame-bid-analysis' }).then(session => {
      if (!session) return;
      const emailId = session.user.email ? session.user.email.split('@')[0] : 'user';
      $('userChip').textContent = emailId;
      $('loadingScreen').classList.add('hidden');
      $('mainContent').classList.remove('auth-hidden');
    });

    $('logoutBtn').addEventListener('click', async () => {
      await logoutToLogin({ page: 'sesame-bid-analysis' });
    });
  </script>
</body>
</html>
