<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>들메내식품 · 원가 관리</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .auth-hidden { display: none !important; }
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #070b14;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    .loading-screen.hidden { display: none; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .app-header {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn, .btn-logout-sm {
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--t2);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .15s, color .15s;
    }
    .back-btn:hover, .btn-logout-sm:hover {
      background: rgba(255, 255, 255, .07);
      color: var(--t0);
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--t0);
      font-size: 14px;
      font-weight: 700;
    }
    .app-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d3ee;
    }
    .user-chip {
      font-size: 11px;
      color: var(--t2);
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
    }
    .page-main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 28px 64px;
      position: relative;
      z-index: 10;
    }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--t0);
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 12px;
      color: var(--t2);
      line-height: 1.6;
    }
    .cost-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .cost-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 150px;
      color: inherit;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .cost-card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(to right, #22d3ee, #6366f1);
    }
    .cost-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 211, 238, .3);
      box-shadow: 0 8px 28px rgba(34, 211, 238, .12);
    }
    .card-kicker {
      font-size: 11px;
      color: var(--t2);
      font-weight: 700;
      letter-spacing: .7px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--t0);
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 12px;
      color: var(--t2);
      line-height: 1.7;
      margin-bottom: 18px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
    }
    .status-pill {
      font-size: 11px;
      color: var(--nm);
      background: var(--nm-bg);
      border: 1px solid rgba(96, 165, 250, .25);
      border-radius: 20px;
      padding: 3px 9px;
      font-weight: 700;
    }
    .arrow {
      color: var(--t2);
      transition: transform .15s, color .15s;
    }
    .cost-card:hover .arrow {
      transform: translateX(3px);
      color: #22d3ee;
    }
    .detail-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .detail-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--t0);
    }
    .detail-body {
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .placeholder-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-w);
      padding: 16px;
      min-height: 88px;
    }
    .placeholder-label {
      font-size: 11px;
      color: var(--t2);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .placeholder-value {
      font-size: 13px;
      color: var(--t1);
      line-height: 1.6;
    }
    .materials-body {
      padding: 18px 20px 22px;
    }
    .material-upload-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .material-upload-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .material-toolbar {
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 18px;
      padding: 18px;
      align-items: stretch;
    }
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      background: var(--card-w);
      min-height: 126px;
      height: 100%;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .upload-zone:hover,
    .upload-zone.over {
      border-color: rgba(34, 211, 238, .45);
      background: rgba(34, 211, 238, .05);
    }
    .upload-icon {
      font-size: 26px;
      opacity: .62;
      margin-bottom: 8px;
      line-height: 1;
    }
    .upload-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--t0);
      line-height: 1.35;
    }
    .upload-sub {
      font-size: 11px;
      color: var(--t2);
      line-height: 1.5;
      margin-top: 5px;
    }
    .upload-sub.ok { color: var(--zr); }
    .upload-sub.err { color: var(--rv); }
    .material-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .summary-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-w);
      padding: 14px;
      min-height: 86px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .summary-label {
      font-size: 10px;
      color: var(--t2);
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .summary-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 800;
      color: var(--t0);
    }
    .summary-value.warn { color: var(--ac); }
    .hierarchy-panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-w);
      padding: 12px;
      margin-bottom: 12px;
    }
    .hierarchy-row + .hierarchy-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .hierarchy-label {
      font-size: 10px;
      color: var(--t2);
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hierarchy-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hierarchy-chip {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(255, 255, 255, .04);
      color: var(--t2);
      height: 30px;
      padding: 0 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .hierarchy-chip:hover,
    .hierarchy-chip.active {
      background: rgba(34, 211, 238, .10);
      border-color: rgba(34, 211, 238, .28);
      color: var(--t0);
    }
    .material-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .material-search {
      min-width: 220px;
      height: 34px;
      border: 1px solid var(--in-br);
      border-radius: 8px;
      background: var(--in-bg);
      color: var(--t0);
      padding: 0 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      outline: none;
    }
    .material-search::placeholder {
      color: var(--in-ph);
    }
    .material-sort {
      height: 34px;
      border: 1px solid var(--in-br);
      border-radius: 8px;
      background: var(--in-bg);
      color: var(--t0);
      padding: 0 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px;
      outline: none;
    }
    .material-note {
      font-size: 11px;
      color: var(--t2);
    }
    .material-status {
      font-size: 11px;
      color: var(--t2);
      min-height: 18px;
    }
    .material-status.ok { color: var(--zr); }
    .material-status.err { color: var(--rv); }
    .material-table-wrap {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      background: rgba(255, 255, 255, .025);
      max-height: 520px;
    }
    .material-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      font-size: 12px;
    }
    .material-table th,
    .material-table td {
      border-bottom: 1px solid var(--tb-br);
      padding: 10px 12px;
      text-align: left;
      vertical-align: middle;
      color: var(--t1);
    }
    .material-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(12, 18, 32, .96);
      color: var(--t2);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .material-table tr:hover td {
      background: var(--tb-hv);
    }
    .material-table td.code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--t0);
      white-space: nowrap;
    }
    .type-pill,
    .row-status {
      display: inline-flex;
      align-items: center;
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .type-pill {
      color: var(--t1);
      background: rgba(255, 255, 255, .04);
    }
    .row-status.ok {
      color: var(--zr);
      background: var(--zr-bg);
      border-color: rgba(74, 222, 128, .24);
    }
    .row-status.warn {
      color: var(--ac);
      background: rgba(251, 191, 36, .10);
      border-color: rgba(251, 191, 36, .24);
    }
    .row-status.err {
      color: var(--rv);
      background: var(--rv-bg);
      border-color: rgba(248, 113, 113, .24);
    }
    .price-input {
      width: 112px;
      height: 30px;
      border: 1px solid var(--in-br);
      border-radius: 7px;
      background: var(--in-bg);
      color: var(--t0);
      padding: 0 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-align: right;
      outline: none;
    }
    .price-input:focus {
      border-color: rgba(34, 211, 238, .45);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .08);
    }
    .empty-state {
      padding: 34px 20px;
      text-align: center;
      color: var(--t2);
      font-size: 12px;
    }
    @media (max-width: 760px) {
      .app-header {
        padding: 0 16px;
      }
      .page-main {
        padding: 22px 16px 48px;
      }
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }
      .cost-grid, .detail-body, .material-toolbar, .material-summary {
        grid-template-columns: 1fr;
      }
      .user-chip {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="blobs"><div class="b1"></div><div class="b2"></div></div>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div style="font-size:12px;color:var(--t2);">인증 확인 중...</div>
  </div>

  <div id="mainContent" class="auth-hidden">
    <header class="app-header">
      <div class="header-left">
        <a class="back-btn" href="/home">← 홈</a>
        <div class="app-title"><span class="dot"></span><span id="navTitle">원가 관리</span></div>
      </div>
      <div class="header-right">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-logout-sm" onclick="handleLogout()">로그아웃</button>
      </div>
    </header>

    <main class="page-main">
      <section class="hero">
        <div>
          <h1 id="pageTitle">원가 관리</h1>
          <p id="pageDesc">BOM, 원부자재 단가, 원가표, 신제품 원가 계산 흐름을 관리합니다.</p>
        </div>
      </section>

      <section id="cardView" class="cost-grid" aria-label="원가 관리 메뉴"></section>
      <section id="detailView" class="detail-panel auth-hidden" aria-label="원가 관리 상세"></section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAlvRWMpYV5Cq2vb0XxpA4t56KuByj8KuE",
      authDomain: "dmnfood-erp.firebaseapp.com",
      projectId: "dmnfood-erp",
      storageBucket: "dmnfood-erp.firebasestorage.app",
      messagingSenderId: "409700382543",
      appId: "1:409700382543:web:35f38e8890702899f2cb58"
    };

    const pages = [
      {
        path: '/cost-bom',
        kicker: 'BOM',
        title: 'BOM 관리 및 조회',
        desc: 'Ecount BOM 엑셀 구조 기준의 품목-소모품목 연결 조회 영역입니다.',
        boxes: [
          ['기준 구조', '생산품목코드, 생산품목명, 생산수량, 소모품목코드, 소모수량'],
          ['Excel 연결', 'Ecount BOM 다운로드/업로드 양식 매핑 예정'],
          ['상태', '조회 화면 준비 단계']
        ]
      },
      {
        path: '/cost-materials',
        kicker: 'Materials',
        title: '원/부자재 단가 관리',
        desc: '원재료, 부자재, 포장재 단가를 원가 계산의 기준 데이터로 관리합니다.',
        view: 'materials',
        boxes: [
          ['기준 데이터', '품목코드, 품목명, 품목구분, 규격정보, 품목그룹1명, 입고단가'],
          ['Excel 연결', 'ERP 웹 품목등록 export 양식 우선 매핑'],
          ['상태', '단가 기준표 준비 단계']
        ]
      },
      {
        path: '/cost-sheets',
        kicker: 'Sheets',
        title: '원가표',
        desc: '기존 제조원가계산 흐름을 품목별 원가표 화면으로 정리합니다.',
        boxes: [
          ['기준 구조', '제품별 구성품, 원재료비, 부자재비, 포장비, 합계'],
          ['Excel 연결', '제조원가계산 workbook의 수식/가정 분리 예정'],
          ['상태', '원가표 보기 준비 단계']
        ]
      },
      {
        path: '/new-product-cost-calculator',
        kicker: 'Calculator',
        title: '신제품 원가 계산기',
        desc: '신규 세트 구성과 예상 단가를 조합해 사전 원가를 검토합니다.',
        boxes: [
          ['기준 구조', '세트분류, 세트명, 용량, 개수, 원산지, 구성품'],
          ['Excel 연결', '원가표.xlsx 계산기/세트구성 데이터시트 확장 예정'],
          ['상태', '입력 양식 준비 단계']
        ]
      }
    ];

    const MATERIAL_STORAGE_KEY = 'dmf_cost_materials_v1';
    let materials = [];
    let materialSearch = '';
    let materialCategory = 'all';
    let materialSubcategory = 'all';
    let materialSort = 'code';

    const materialCategories = {
      all: { label: '전체', icon: '전체' },
      raw: { label: '원재료', icon: '🌾' },
      package: { label: '부자재/포장재', icon: '📦' },
      gift: { label: '세트제품', icon: '🎁' },
      product: { label: '반제품·제품', icon: '🏷️' },
      other: { label: '기타비용', icon: '🧾' },
      unknown: { label: '미분류', icon: '？' },
    };

    const subcategoryRules = {
      raw: [
        { key: 'D-SS', label: '참깨', prefixes: ['D-SS'] },
        { key: 'D-PS', label: '들깨', prefixes: ['D-PS'] },
        { key: 'D-S', label: '소금', prefixes: ['D-S-'] },
      ],
      package: [
        { key: 'D-P-L', label: '라벨', prefixes: ['D-P-L'] },
        { key: 'bottle', label: '병', prefixes: ['D-P-OGB', 'D-P-OPB', 'D-P-SSPB', 'D-P-SGB', 'D-P-SPB'] },
        { key: 'cap', label: '뚜껑', prefixes: ['D-P-OGBC', 'D-P-OPBC', 'DP-SSPBC', 'D-P-SGBC', 'D-P-SPBC'] },
        { key: 'D-P-B', label: '박스', prefixes: ['D-P-B'] },
        { key: 'D-P-P', label: '패드', prefixes: ['D-P-P'] },
        { key: 'box-bag', label: '카톤/개별박스/쇼핑백', prefixes: ['D-P-CB', 'D-P-IB', 'D-P-SB'] },
      ],
      gift: [
        { key: 'D-GS-C', label: '행복가득', prefixes: ['D-GS-C'] },
        { key: 'D-GS-I', label: '결들', prefixes: ['D-GS-I'] },
        { key: 'D-GS-K', label: '들메내', prefixes: ['D-GS-K'] },
      ],
      product: [
        { key: 'D-SO', label: '참기름', prefixes: ['D-SO'] },
        { key: 'D-PO', label: '들기름', prefixes: ['D-PO'] },
        { key: 'D-RSS', label: '볶음통깨', prefixes: ['D-RSS'] },
        { key: 'D-RS', label: '소금제품', prefixes: ['D-RS'] },
      ],
      other: [
        { key: 'D-OS', label: '기타비용', prefixes: ['D-OS'] },
      ],
      unknown: [
        { key: 'unknown', label: '미분류', prefixes: [] },
      ],
    };

    materials = loadMaterials();

    function toNumber(value) {
      if (value === null || value === undefined || value === '') return 0;
      const cleaned = String(value).replace(/,/g, '').trim();
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatPrice(value) {
      const numeric = toNumber(value);
      return numeric ? numeric.toLocaleString('ko-KR') : '0';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }

    function classifyMaterial(item) {
      const code = String(item.itemCode || '').trim().toUpperCase();
      const name = `${item.itemName || ''} ${item.spec || ''}`.toLowerCase();
      const hasAny = keywords => keywords.some(keyword => name.includes(keyword));

      if (code.startsWith('D-SS') || code.startsWith('D-PS') || code.startsWith('D-S-')) {
        return 'raw';
      }
      if (code.startsWith('D-P-') || code.startsWith('DP-')) {
        return 'package';
      }
      if (code.startsWith('D-GS')) {
        return 'gift';
      }
      if (code.startsWith('D-SO') || code.startsWith('D-PO') || code.startsWith('D-RSS') || code.startsWith('D-RS')) {
        return 'product';
      }
      if (code.startsWith('D-OS')) {
        return 'other';
      }

      if (hasAny(['병', '뚜껑', '캡', '라벨', '박스', '상자', '스티커', '포장', '봉투', '쇼핑백', '패드', '로프'])) {
        return 'package';
      }
      if (hasAny(['세트'])) {
        return 'gift';
      }
      if (hasAny(['참기름', '들기름', '볶음통깨', '제품'])) {
        return 'product';
      }
      if (hasAny(['참깨', '들깨', '깨분', '통깨', '깨', '원재료', '소금'])) {
        return 'raw';
      }
      return 'unknown';
    }

    function getSubcategory(item) {
      const code = String(item.itemCode || '').trim().toUpperCase();
      const category = classifyMaterial(item);
      const rules = subcategoryRules[category] || [];
      const match = rules.find(rule => rule.prefixes.some(prefix => code.startsWith(prefix)));
      if (match) return match;

      if (category === 'unknown') return subcategoryRules.unknown[0];
      return { key: 'other', label: '기타', prefixes: [] };
    }

    function getItemStatus(item) {
      if (classifyMaterial(item) === 'unknown') return { label: '미분류', className: 'err' };
      if (toNumber(item.purchasePrice) <= 0) return { label: '단가 미입력', className: 'warn' };
      return { label: '정상', className: 'ok' };
    }

    function enrichMaterial(item) {
      const normalized = {
        itemCode: String(item.itemCode || '').trim(),
        itemName: String(item.itemName || '').trim(),
        itemType: String(item.itemType || '').trim(),
        spec: String(item.spec ?? item.standard ?? '').trim(),
        itemGroupName: String(item.itemGroupName || '').trim(),
        purchasePrice: toNumber(item.purchasePrice),
        purchasePriceVatIncluded: String(item.purchasePriceVatIncluded ?? '').trim(),
        edited: Boolean(item.edited),
      };
      normalized.majorCategory = classifyMaterial(normalized);
      normalized.subCategory = getSubcategory(normalized).label;
      normalized.status = getItemStatus(normalized).label;
      return normalized;
    }

    function matchesSubcategory(item) {
      if (materialSubcategory === 'all') return true;
      return getSubcategory(item).key === materialSubcategory;
    }

    function sortMaterials(list) {
      const sorted = [...list];
      sorted.sort((a, b) => {
        if (materialSort === 'missing') {
          const aMissing = toNumber(a.purchasePrice) <= 0 ? 0 : 1;
          const bMissing = toNumber(b.purchasePrice) <= 0 ? 0 : 1;
          if (aMissing !== bMissing) return aMissing - bMissing;
        }
        return String(a.itemCode).localeCompare(String(b.itemCode), 'ko-KR', { numeric: true });
      });
      return sorted;
    }

    function getSubcategoryOptions() {
      if (materialCategory === 'all' || materialCategory === 'unpriced') return [];
      const rules = subcategoryRules[materialCategory] || [];
      return rules.map(rule => ({
        ...rule,
        count: materials.filter(item => classifyMaterial(item) === materialCategory && getSubcategory(item).key === rule.key).length,
      })).filter(rule => rule.count > 0 || materialCategory !== 'unknown');
    }

    function renderHierarchySelectors() {
      const majorHost = document.getElementById('majorCategoryChips');
      const subHost = document.getElementById('subCategoryChips');
      if (!majorHost || !subHost) return;

      const stats = getMaterialStats();
      const majorOptions = [
        ['all', '전체', stats.all],
        ['raw', '원재료', stats.raw],
        ['package', '부자재/포장재', stats.package],
        ['gift', '세트제품', stats.gift],
        ['product', '반제품·제품', stats.product],
        ['other', '기타비용', stats.other],
        ['unknown', '미분류', stats.unknown],
        ['unpriced', '단가 미입력', stats.unpriced],
      ];

      majorHost.innerHTML = majorOptions.map(([key, label, count]) => `
        <button class="hierarchy-chip major-filter ${materialCategory === key ? 'active' : ''}" type="button" data-category="${key}">
          ${label} ${Number(count).toLocaleString('ko-KR')}
        </button>
      `).join('');

      const options = getSubcategoryOptions();
      if (!options.length) {
        subHost.innerHTML = '<span class="material-note">하위 분류 없음</span>';
        return;
      }

      const total = options.reduce((sum, option) => sum + option.count, 0);
      subHost.innerHTML = [
        `<button class="hierarchy-chip sub-filter ${materialSubcategory === 'all' ? 'active' : ''}" type="button" data-subcategory="all">전체 ${total.toLocaleString('ko-KR')}</button>`,
        ...options.map(option => `
          <button class="hierarchy-chip sub-filter ${materialSubcategory === option.key ? 'active' : ''}" type="button" data-subcategory="${option.key}">
            ${option.label} ${option.count.toLocaleString('ko-KR')}
          </button>
        `)
      ].join('');
    }

    function getMaterialStats() {
      const stats = {
        all: materials.length,
        raw: 0,
        package: 0,
        gift: 0,
        product: 0,
        productSet: 0,
        other: 0,
        unknown: 0,
        unpriced: 0,
      };

      materials.forEach(item => {
        const category = classifyMaterial(item);
        stats[category] += 1;
        if (category === 'gift' || category === 'product') stats.productSet += 1;
        if (toNumber(item.purchasePrice) <= 0) stats.unpriced += 1;
      });

      return stats;
    }

    function loadMaterials() {
      try {
        const saved = JSON.parse(localStorage.getItem(MATERIAL_STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved.map(item => enrichMaterial(item)) : [];
      } catch {
        return [];
      }
    }

    function saveMaterials() {
      localStorage.setItem(MATERIAL_STORAGE_KEY, JSON.stringify(materials));
    }

    function normalizeHeader(value) {
      return String(value || '').replace(/\s+/g, '').trim();
    }

    function buildHeaderMap(headerRow) {
      const map = new Map();
      headerRow.forEach((header, index) => {
        const normalized = normalizeHeader(header);
        if (normalized) map.set(normalized, index);
      });
      return map;
    }

    function getCell(row, headerMap, headerName) {
      const index = headerMap.get(normalizeHeader(headerName));
      return index === undefined ? '' : row[index];
    }

    function mapEcountItemRow(row, headerMap) {
      return enrichMaterial({
        itemCode: String(getCell(row, headerMap, '품목코드') || '').trim(),
        itemName: String(getCell(row, headerMap, '품목명') || '').trim(),
        itemType: String(getCell(row, headerMap, '품목구분') || '').trim(),
        spec: String(getCell(row, headerMap, '규격정보') || getCell(row, headerMap, '규격') || '').trim(),
        itemGroupName: String(getCell(row, headerMap, '품목그룹1명') || '').trim(),
        purchasePrice: toNumber(getCell(row, headerMap, '입고단가')),
        purchasePriceVatIncluded: String(getCell(row, headerMap, '입고단가Vat포함여부') || getCell(row, headerMap, '입고단가 VAT포함여부') || '').trim(),
      });
    }

    function findMaterialSheet(workbook) {
      const required = ['품목코드', '품목명'];
      const preferred = workbook.SheetNames.find(name => name === '품목등록')
        || workbook.SheetNames.find(name => name.includes('품목'));
      const names = preferred ? [preferred, ...workbook.SheetNames.filter(name => name !== preferred)] : workbook.SheetNames;

      for (const name of names) {
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: '' });
        if (!rows.length) continue;
        let headerRowIndex = -1;
        if (name === '품목등록' && rows[1]) {
          const row2Map = buildHeaderMap(rows[1]);
          if (required.every(header => row2Map.has(normalizeHeader(header)))) headerRowIndex = 1;
        }
        if (headerRowIndex === -1) {
          headerRowIndex = rows.findIndex(row => {
            const headerMap = buildHeaderMap(row);
            return required.every(header => headerMap.has(normalizeHeader(header)));
          });
        }
        if (headerRowIndex === -1) continue;
        const headerMap = buildHeaderMap(rows[headerRowIndex]);
        return { name, rows: rows.slice(headerRowIndex + 1), headerMap };
      }

      return null;
    }

    function setMaterialStatus(message, type = '') {
      const status = document.getElementById('materialStatus');
      if (!status) return;
      status.textContent = message;
      status.className = `material-status ${type}`.trim();
    }

    function getFilteredMaterials() {
      const term = materialSearch.trim().toLowerCase();
      const filtered = materials.filter(item => {
        const matchesCategory = materialCategory === 'all'
          || (materialCategory === 'unpriced' && toNumber(item.purchasePrice) <= 0)
          || classifyMaterial(item) === materialCategory;
        const matchesSub = matchesSubcategory(item);
        const matchesTerm = !term
          || item.itemCode.toLowerCase().includes(term)
          || item.itemName.toLowerCase().includes(term)
          || item.spec.toLowerCase().includes(term)
          || item.itemGroupName.toLowerCase().includes(term);
        return matchesCategory && matchesSub && matchesTerm;
      });
      return sortMaterials(filtered);
    }

    function renderMaterialTable() {
      const tableBody = document.getElementById('materialTableBody');
      const empty = document.getElementById('materialEmpty');
      const totalEl = document.getElementById('materialTotalCount');
      const rawEl = document.getElementById('materialRawCount');
      const packageEl = document.getElementById('materialPackageCount');
      const productSetEl = document.getElementById('materialProductSetCount');
      const unpricedEl = document.getElementById('materialUnpricedCount');
      if (!tableBody || !empty) return;

      const filtered = getFilteredMaterials();
      const stats = getMaterialStats();
      if (totalEl) totalEl.textContent = stats.all.toLocaleString('ko-KR');
      if (rawEl) rawEl.textContent = stats.raw.toLocaleString('ko-KR');
      if (packageEl) packageEl.textContent = stats.package.toLocaleString('ko-KR');
      if (productSetEl) productSetEl.textContent = stats.productSet.toLocaleString('ko-KR');
      if (unpricedEl) unpricedEl.textContent = stats.unpriced.toLocaleString('ko-KR');

      empty.style.display = filtered.length ? 'none' : 'block';
      renderHierarchySelectors();
      tableBody.innerHTML = filtered.map(item => `
        <tr>
          <td class="code">${escapeHtml(item.itemCode)}</td>
          <td>${escapeHtml(item.itemName)}</td>
          <td>${escapeHtml(item.itemType || '-')}</td>
          <td>${escapeHtml(item.spec || '-')}</td>
          <td>${escapeHtml(item.itemGroupName || '-')}</td>
          <td><span class="type-pill">${escapeHtml(materialCategories[classifyMaterial(item)]?.label || '미분류')} / ${escapeHtml(getSubcategory(item).label)}</span></td>
          <td>
            <input class="price-input" type="number" min="0" step="1" value="${toNumber(item.purchasePrice)}"
              data-code="${escapeHtml(item.itemCode)}" data-field="purchasePrice" aria-label="${escapeHtml(item.itemName)} 입고단가">
          </td>
          <td>${escapeHtml(item.purchasePriceVatIncluded || '-')}</td>
          <td><span class="row-status ${getItemStatus(item).className}">${getItemStatus(item).label}</span></td>
        </tr>
      `).join('');
    }

    function bindMaterialEvents() {
      const fileInput = document.getElementById('materialFileInput');
      const uploadZone = document.getElementById('materialUploadZone');
      const searchInput = document.getElementById('materialSearch');
      const sortSelect = document.getElementById('materialSort');
      const tableBody = document.getElementById('materialTableBody');
      const hierarchyPanel = document.getElementById('materialHierarchy');

      uploadZone?.addEventListener('click', event => {
        if (event.target === fileInput) return;
        fileInput?.click();
      });
      uploadZone?.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        fileInput?.click();
      });
      fileInput?.addEventListener('change', async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        await importMaterialWorkbook(file);
        event.target.value = '';
      });
      uploadZone?.addEventListener('dragover', event => {
        event.preventDefault();
        uploadZone.classList.add('over');
      });
      uploadZone?.addEventListener('dragleave', () => uploadZone.classList.remove('over'));
      uploadZone?.addEventListener('drop', async event => {
        event.preventDefault();
        uploadZone.classList.remove('over');
        const file = event.dataTransfer.files?.[0];
        if (file) await importMaterialWorkbook(file);
      });

      searchInput?.addEventListener('input', event => {
        materialSearch = event.target.value;
        renderMaterialTable();
      });

      sortSelect?.addEventListener('change', event => {
        materialSort = event.target.value;
        renderMaterialTable();
      });

      hierarchyPanel?.addEventListener('click', event => {
        const majorButton = event.target.closest('.major-filter');
        const subButton = event.target.closest('.sub-filter');
        if (majorButton) {
          materialCategory = majorButton.dataset.category;
          materialSubcategory = 'all';
          renderMaterialTable();
          return;
        }
        if (subButton) {
          materialSubcategory = subButton.dataset.subcategory;
          renderMaterialTable();
        }
      });

      tableBody?.addEventListener('change', event => {
        const input = event.target.closest('.price-input');
        if (!input) return;
        const index = materials.findIndex(item => item.itemCode === input.dataset.code);
        if (index === -1) return;
        materials[index] = enrichMaterial({ ...materials[index], [input.dataset.field]: toNumber(input.value), edited: true });
        saveMaterials();
        renderMaterialTable();
        setMaterialStatus('수정사항이 브라우저에 저장되었습니다.', 'ok');
      });
    }

    async function importMaterialWorkbook(file) {
      if (!window.XLSX) {
        setMaterialStatus('엑셀 처리 라이브러리를 불러오지 못했습니다.', 'err');
        return;
      }

      try {
        setMaterialStatus('엑셀 파일을 읽는 중...');
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheet = findMaterialSheet(workbook);
        if (!sheet) {
          setMaterialStatus('품목코드/품목명 열이 있는 품목 시트를 찾지 못했습니다.', 'err');
          return;
        }

        const nextMaterials = sheet.rows
          .map(row => mapEcountItemRow(row, sheet.headerMap))
          .filter(item => item.itemCode && item.itemName);

        if (!nextMaterials.length) {
          setMaterialStatus('가져올 품목 데이터가 없습니다.', 'err');
          return;
        }

        const existingByCode = new Map(materials.map(item => [item.itemCode, item]));
        materials = nextMaterials.map(item => {
          const existing = existingByCode.get(item.itemCode);
          return existing?.edited
            ? enrichMaterial({ ...item, purchasePrice: existing.purchasePrice, edited: true })
            : item;
        });
        saveMaterials();
        renderMaterialTable();
        const uploadTitle = document.getElementById('materialUploadTitle');
        const uploadSub = document.getElementById('materialUploadSub');
        if (uploadTitle) uploadTitle.textContent = file.name;
        if (uploadSub) {
          uploadSub.textContent = `${sheet.name} · ${materials.length.toLocaleString('ko-KR')}개 품목`;
          uploadSub.className = 'upload-sub ok';
        }
        setMaterialStatus(`${sheet.name}에서 ${materials.length.toLocaleString('ko-KR')}개 품목을 가져왔습니다.`, 'ok');
      } catch (error) {
        console.error(error);
        const uploadSub = document.getElementById('materialUploadSub');
        if (uploadSub) {
          uploadSub.textContent = '엑셀 파일을 처리하지 못했습니다.';
          uploadSub.className = 'upload-sub err';
        }
        setMaterialStatus('엑셀 파일을 처리하지 못했습니다.', 'err');
      }
    }

            <input class="material-search" id="materialSearch" type="search" placeholder="품목코드 / 품목명 / 규격 / 그룹 검색" value="${escapeHtml(materialSearch)}">
            <select class="material-sort" id="materialSort" aria-label="정렬">
              <option value="code" ${materialSort === 'code' ? 'selected' : ''}>코드순</option>
              <option value="missing" ${materialSort === 'missing' ? 'selected' : ''}>단가 미입력 우선</option>
            </select>

          </div>
          <div class="material-table-wrap">
            <table class="material-table">
              <thead>
                <tr>
                  <th>품목코드</th>

                  <th>품목구분</th>

              </thead>

    function render() {
      const current = pages.find(page => page.path === window.location.pathname);
      const cardView = document.getElementById('cardView');
      const detailView = document.getElementById('detailView');

      if (!current) {
        document.getElementById('navTitle').textContent = '원가 관리';
        document.getElementById('pageTitle').textContent = '원가 관리';
        document.getElementById('pageDesc').textContent = 'BOM, 원부자재 단가, 원가표, 신제품 원가 계산 흐름을 관리합니다.';
        detailView.classList.add('auth-hidden');
        cardView.classList.remove('auth-hidden');
        cardView.innerHTML = pages.map(page => `
          <a class="cost-card" href="${page.path}">
            <div class="card-kicker">${page.kicker}</div>
            <div class="card-title">${page.title}</div>
            <div class="card-desc">${page.desc}</div>
            <div class="card-meta">
              <span class="status-pill">준비 중</span>
              <span class="arrow">→</span>
            </div>
          </a>
        `).join('');
        return;
      }

      document.getElementById('navTitle').textContent = current.title;
      document.getElementById('pageTitle').textContent = current.title;
      document.getElementById('pageDesc').textContent = current.desc;
      cardView.classList.add('auth-hidden');
      detailView.classList.remove('auth-hidden');
      if (current.view === 'materials') {
        renderMaterialsView(detailView, current);
        return;
      }
      detailView.innerHTML = `
        <div class="detail-head">
          <div class="detail-title">${current.title}</div>
          <span class="status-pill">준비 중</span>
        </div>
        <div class="detail-body">
          ${current.boxes.map(([label, value]) => `
            <div class="placeholder-box">
              <div class="placeholder-label">${label}</div>
              <div class="placeholder-value">${value}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    render();

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = '/';
        return;
      }
      document.getElementById('userChip').textContent = user.email.split('@')[0];
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('auth-hidden');
    });

    window.handleLogout = async () => {
      if (!confirm('로그아웃 하시겠습니까?')) return;
      await signOut(auth);
      window.location.href = '/';
    };
  </script>
</body>

</html>
