<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가입 승인 / 사용자 관리 · 들메내식품</title>
  <link rel="stylesheet" href="/dashboard/style.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#183f33;font-family:Arial,sans-serif}
    main{max-width:1080px;margin:40px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}
    h1{font-size:25px}a{color:#267453}p{line-height:1.6}button,select{font:inherit;padding:9px 13px;border:1px solid #c2d8cc;border-radius:8px;background:#fff;color:#214d3b}
    button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.approve{background:#237a55;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}
    .table-wrap{overflow:auto;background:white;border:1px solid #d5e2db;border-radius:12px;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:16px;border-bottom:1px solid #e7eee9}#management thead th{background:#e8f3ed;color:#214d3b;font-size:13px}td{font-size:14px}.email{font-size:12px;color:#62776b;margin-top:5px}#message{min-height:24px;color:#926224}[hidden]{display:none!important}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column;gap:8px;margin-bottom:16px}h1{font-size:23px}header a{white-space:nowrap}table{min-width:0}thead{display:none}table,tbody{display:block}tr{display:grid;grid-template-columns:1fr 1fr;padding:12px;border-bottom:1px solid #d5e2db}td{border:0;padding:8px}td:first-child,td:last-child{grid-column:1/-1}td:nth-child(2)::before{content:'권한: ';color:#62776b}td:nth-child(3)::before{content:'상태: ';color:#62776b}.email{overflow-wrap:anywhere}}
  </style>
</head>
<body>
<main>
  <header><h1>가입 승인 / 사용자 관리</h1><a href="/home">대시보드로</a></header>
  <p>가입 신청을 확인한 뒤 직원의 사용을 승인해 주세요. 사용 중지는 저장된 기록을 삭제하지 않습니다.</p>
  <p id="message" role="status">계정 권한을 확인하고 있습니다.</p>
  <section id="management" hidden>
    <label for="filter">표시할 계정 </label><select id="filter"><option value="all">전체</option><option value="pending">승인 대기</option><option value="approved">사용 중</option><option value="inactive">사용 중지</option><option value="rejected">승인 거절</option></select>
    <div class="table-wrap"><table><thead><tr><th>이름 / 이메일</th><th>권한</th><th>상태</th><th>관리</th></tr></thead><tbody id="users"></tbody></table></div>
  </section>
</main>
<script type="module" src="/dashboard/js/users.js"></script>
</body></html>
